<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10111a">
    <meta name="description" content="Fahad Lal — Computer Science student, developer, and AI/ML enthusiast.">
    <title>Fahad Lal | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <canvas id="neural-canvas" aria-hidden="true"></canvas>
    <!-- Top Navigation -->
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">

            <!-- Left: Brand -->
            <a href="#home" class="brand">
                <span class="brand-dot">.</span>Fahad
            </a>

            <!-- Center: Navigation links -->
            <div class="nav-links">
                <a href="#home" class="active">Home</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
            </div>

            <!-- Right: Social icons -->
            <div id="links" class="navbar-socials"
                aria-label="Social profiles"></div>

        </nav>
    </header>

    <!-- Hero -->
    <main>
        <section class="hero" id="home">

            <!-- Left: neural network -->
            <div class="hero-visual" id="hero">
                <canvas id="neural-network"
                    aria-label="Animated neural network visualization"
                    role="img"></canvas>

                
            </div>

            <!-- Right: Personal introduction -->
            <div class="hero-content">
                <p class="eyebrow">
                    COMPUTER SCIENCE <span>·</span> AI / ML
                </p>

                <h1>
                    Hi, I'm <span id="name"></span>
                </h1>

                <p id="tagline" class="tagline"></p>

                <p id="hero-bio" class="hero-bio"></p>

                <div class="hero-actions">
                    <a
                        href="https://drive.google.com/file/d/1En2auELsVuPyitRh2LUeTLbkmFUv3YQK/view?usp=sharing"
                        class="btn btn-primary"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        My Resume <span>↗</span>
                    </a>

                    <a href="#footer" class="btn btn-secondary">
                        Connect
                    </a>
                </div>
            </div>

        </section>

        <!-- About -->
        <section class="section about-section" id="about">
            <div class="section-heading">
                <p class="eyebrow">A LITTLE ABOUT ME</p>
                <h2>Always learning. Always building.</h2>
            </div>

            <p id="about-bio"></p>
        </section>


        <!-- Skills -->
        <section class="section" id="skills">
            <div class="section-heading">
                <p class="eyebrow">WHAT I WORK WITH</p>
                <h2>Skills & Technologies</h2>
            </div>

            <ul id="skills-list" class="chips"></ul>
        </section>

        <!-- Projects -->
        <section class="section" id="projects">
            <div class="section-heading">
                <p class="eyebrow">WHAT I'VE BUILT</p>
                <h2>Featured Projects</h2>
            </div>

            <div id="projects-list" class="grid"></div>
        </section>

        
    </main>

    <footer id="footer">
        <p>Byeeeeeeeeeee!</p>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/neural-bg.js"></script>

</body>
</html>
